<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Quest - 楽しくPythonを学ぼう！</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; margin: 0; }
    .font-bangers { font-family: 'Bangers', cursive; }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(180deg); } }
    @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    @keyframes slide-down { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); } 50% { box-shadow: 0 0 40px rgba(168, 85, 247, 0.8); } }
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-bounce-slow { animation: bounce-slow 2s ease-in-out infinite; }
    .animate-fall { animation: fall 3s linear forwards; }
    .animate-slide-down { animation: slide-down 0.5s ease-out; }
    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Quiz Data
    const quizData = [
      {
        id: 1, type: 'quiz', title: 'はじめてのPython 🐍',
        question: 'Pythonで「Hello」と表示するにはどれを使う？',
        options: ['echo("Hello")', 'print("Hello")', 'console.log("Hello")', 'say("Hello")'],
        correct: 1, points: 100, hint: 'Pythonでは print() 関数を使って出力します！'
      },
      {
        id: 2, type: 'fill', title: '変数をつくろう 📦',
        question: '変数 name に "たろう" を代入してください',
        template: 'name = ___', answer: '"たろう"', alternativeAnswers: ["'たろう'"],
        points: 150, hint: '文字列は "" または \'\' で囲みます！'
      },
      {
        id: 3, type: 'code', title: 'コードを書こう！ ✨',
        question: '1から5までの数字を順番に表示するコードを書いてください',
        starterCode: '# ここにコードを書いてね\nfor i in range(1, 6):\n    print(i)',
        expectedOutput: '1\n2\n3\n4\n5', points: 200, hint: 'for文とrange()を使ってみよう！'
      },
      {
        id: 4, type: 'quiz', title: 'データ型クイズ 🎯',
        question: '次のうち「整数」はどれ？',
        options: ['"42"', '42.0', '42', 'True'],
        correct: 2, points: 100, hint: '整数（int）は小数点がない数字です！'
      },
      {
        id: 5, type: 'fill', title: 'リストを作ろう 📝',
        question: 'フルーツのリストを作成してください',
        template: 'fruits = [___, "banana", "orange"]', answer: '"apple"', alternativeAnswers: ["'apple'"],
        points: 150, hint: 'リストの要素も文字列は "" で囲みます！'
      },
      {
        id: 6, type: 'code', title: '計算してみよう 🔢',
        question: '変数 a=10, b=3 を定義し、a÷b の結果を表示してください',
        starterCode: '# 変数を定義して計算しよう\na = 10\nb = 3\nprint(a / b)',
        expectedOutput: '3.3333333333333335', points: 200, hint: '割り算は / を使います！'
      }
    ];

    // Badges
    const badges = [
      { id: 'first_correct', name: '初めての正解', icon: '🌟', condition: (s) => s.correct >= 1 },
      { id: 'streak_3', name: '3連続正解', icon: '🔥', condition: (s) => s.streak >= 3 },
      { id: 'points_500', name: '500ポイント達成', icon: '💎', condition: (s) => s.points >= 500 },
      { id: 'all_clear', name: '全問クリア', icon: '👑', condition: (s) => s.completed >= quizData.length },
      { id: 'code_master', name: 'コードマスター', icon: '🚀', condition: (s) => s.codeCorrect >= 2 },
    ];

    // Icons as simple SVG components
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        play: <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>,
        star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor"/>,
        zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor"/>,
        check: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" strokeWidth="2" fill="none"/><polyline points="22 4 12 14.01 9 11.01" stroke="currentColor" strokeWidth="2" fill="none"/></>,
        x: <><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="2" fill="none"/><line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" strokeWidth="2"/><line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" strokeWidth="2"/></>,
        code: <><polyline points="16 18 22 12 16 6" stroke="currentColor" strokeWidth="2" fill="none"/><polyline points="8 6 2 12 8 18" stroke="currentColor" strokeWidth="2" fill="none"/></>,
        terminal: <><polyline points="4 17 10 11 4 5" stroke="currentColor" strokeWidth="2" fill="none"/><line x1="12" y1="19" x2="20" y2="19" stroke="currentColor" strokeWidth="2"/></>,
        arrow: <><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" strokeWidth="2"/><polyline points="12 5 19 12 12 19" stroke="currentColor" strokeWidth="2" fill="none"/></>,
        refresh: <><polyline points="23 4 23 10 17 10" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" stroke="currentColor" strokeWidth="2" fill="none"/></>,
        sparkle: <><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4" stroke="currentColor" strokeWidth="1.5" fill="none"/></>,
        trophy: <><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M4 22h16" stroke="currentColor" strokeWidth="2"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" stroke="currentColor" strokeWidth="2" fill="none"/></>
      };
      return <svg className={className} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">{icons[name]}</svg>;
    };

    // Confetti
    const Confetti = ({ show }) => {
      if (!show) return null;
      const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181', '#AA96DA'];
      return (
        <div className="fixed inset-0 pointer-events-none z-50">
          {[...Array(50)].map((_, i) => (
            <div key={i} className="absolute animate-fall"
              style={{ left: `${Math.random() * 100}%`, top: '-20px', animationDelay: `${Math.random() * 0.5}s`, animationDuration: `${1 + Math.random() * 2}s` }}>
              <div className="w-3 h-3 rounded-sm" style={{ backgroundColor: colors[Math.floor(Math.random() * 6)], transform: `rotate(${Math.random() * 360}deg)` }}/>
            </div>
          ))}
        </div>
      );
    };

    // Main App
    function App() {
      const [pyodide, setPyodide] = useState(null);
      const [pyLoading, setPyLoading] = useState(true);
      const [currentQ, setCurrentQ] = useState(0);
      const [stats, setStats] = useState({ points: 0, correct: 0, streak: 0, completed: 0, codeCorrect: 0 });
      const [earnedBadges, setEarnedBadges] = useState([]);
      const [showConfetti, setShowConfetti] = useState(false);
      const [feedback, setFeedback] = useState(null);
      const [fillAnswer, setFillAnswer] = useState('');
      const [codeInput, setCodeInput] = useState('');
      const [codeOutput, setCodeOutput] = useState('');
      const [isRunning, setIsRunning] = useState(false);
      const [showHint, setShowHint] = useState(false);
      const [gameStarted, setGameStarted] = useState(false);
      const [newBadge, setNewBadge] = useState(null);

      const question = quizData[currentQ];

      // Load Pyodide
      useEffect(() => {
        (async () => {
          try {
            const py = await loadPyodide();
            setPyodide(py);
            setPyLoading(false);
          } catch (e) { console.error(e); setPyLoading(false); }
        })();
      }, []);

      useEffect(() => {
        if (question?.type === 'code') setCodeInput(question.starterCode);
      }, [currentQ]);

      // Check badges
      useEffect(() => {
        badges.forEach(b => {
          if (b.condition(stats) && !earnedBadges.includes(b.id)) {
            setEarnedBadges(prev => [...prev, b.id]);
            setNewBadge(b);
            setTimeout(() => setNewBadge(null), 3000);
          }
        });
      }, [stats]);

      const runPython = async (code) => {
        if (!pyodide) return 'Python環境を読み込み中...';
        setIsRunning(true);
        try {
          pyodide.runPython(`import sys\nfrom io import StringIO\nsys.stdout = StringIO()`);
          pyodide.runPython(code);
          const output = pyodide.runPython('sys.stdout.getvalue()');
          setIsRunning(false);
          return output.trim();
        } catch (e) { setIsRunning(false); return `エラー: ${e.message}`; }
      };

      const celebrate = (points) => {
        setShowConfetti(true);
        setTimeout(() => setShowConfetti(false), 2000);
        setStats(p => ({ ...p, points: p.points + points, correct: p.correct + 1, streak: p.streak + 1, completed: p.completed + 1 }));
      };

      const handleQuiz = (idx) => {
        if (idx === question.correct) {
          celebrate(question.points);
          setFeedback({ type: 'success', msg: `正解！ +${question.points}ポイント 🎉` });
        } else {
          setStats(p => ({ ...p, streak: 0 }));
          setFeedback({ type: 'error', msg: 'おしい！もう一度挑戦してみよう 💪' });
        }
      };

      const handleFill = () => {
        const correct = fillAnswer.trim() === question.answer || question.alternativeAnswers?.includes(fillAnswer.trim());
        if (correct) {
          celebrate(question.points);
          setFeedback({ type: 'success', msg: `完璧！ +${question.points}ポイント ✨` });
        } else {
          setStats(p => ({ ...p, streak: 0 }));
          setFeedback({ type: 'error', msg: `正解は ${question.answer} でした！` });
        }
      };

      const handleCode = async () => {
        const output = await runPython(codeInput);
        setCodeOutput(output);
        if (output.trim() === question.expectedOutput.trim()) {
          celebrate(question.points);
          setStats(p => ({ ...p, codeCorrect: p.codeCorrect + 1 }));
          setFeedback({ type: 'success', msg: `すごい！コード完璧！ +${question.points}ポイント 🚀` });
        } else {
          setStats(p => ({ ...p, streak: 0 }));
          setFeedback({ type: 'error', msg: '出力が期待と違うよ。もう一度試してみよう！' });
        }
      };

      const nextQ = () => {
        if (currentQ < quizData.length - 1) {
          setCurrentQ(p => p + 1);
          setFeedback(null); setFillAnswer(''); setCodeOutput(''); setShowHint(false);
        }
      };

      const reset = () => {
        setCurrentQ(0);
        setStats({ points: 0, correct: 0, streak: 0, completed: 0, codeCorrect: 0 });
        setEarnedBadges([]); setFeedback(null); setFillAnswer(''); setCodeOutput(''); setShowHint(false); setGameStarted(false);
      };

      // Start Screen
      if (!gameStarted) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 flex items-center justify-center p-4 overflow-hidden relative">
            <div className="absolute inset-0 overflow-hidden">
              {[...Array(15)].map((_, i) => (
                <div key={i} className="absolute rounded-full opacity-20 animate-float"
                  style={{ width: `${20 + Math.random() * 60}px`, height: `${20 + Math.random() * 60}px`, left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`, background: 'linear-gradient(45deg, #00D9FF, #FF00FF)', animationDelay: `${Math.random() * 5}s`, animationDuration: `${3 + Math.random() * 4}s` }}/>
              ))}
            </div>
            <div className="relative z-10 text-center max-w-2xl">
              <div className="mb-8 animate-bounce-slow"><span className="text-8xl md:text-9xl">🐍</span></div>
              <h1 className="font-bangers text-5xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 mb-4">Python Quest</h1>
              <p className="text-lg md:text-xl text-purple-200 mb-8">楽しくPythonを学ぼう！クイズに挑戦してポイントをゲット！</p>
              <div className="flex flex-wrap justify-center gap-4 mb-8">
                <div className="bg-white/10 backdrop-blur-sm rounded-2xl px-4 py-3 border border-white/20">
                  <div className="text-cyan-400 mb-1"><Icon name="code" className="w-8 h-8 mx-auto"/></div>
                  <p className="text-white text-sm font-medium">実際にコードを実行</p>
                </div>
                <div className="bg-white/10 backdrop-blur-sm rounded-2xl px-4 py-3 border border-white/20">
                  <div className="text-yellow-400 mb-1"><Icon name="trophy" className="w-8 h-8 mx-auto"/></div>
                  <p className="text-white text-sm font-medium">バッジを集めよう</p>
                </div>
                <div className="bg-white/10 backdrop-blur-sm rounded-2xl px-4 py-3 border border-white/20">
                  <div className="text-pink-400 mb-1"><Icon name="zap" className="w-8 h-8 mx-auto"/></div>
                  <p className="text-white text-sm font-medium">連続正解でボーナス</p>
                </div>
              </div>
              {pyLoading ? (
                <div className="text-purple-300 mb-4"><span className="inline-block animate-spin mr-2">⚙️</span>Python環境を準備中...</div>
              ) : (
                <button onClick={() => setGameStarted(true)} className="group relative px-10 py-4 bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 rounded-full text-white text-xl font-bold shadow-2xl hover:scale-105 transition-all animate-pulse-glow">
                  <span className="flex items-center gap-2">スタート！<Icon name="arrow" className="w-5 h-5 group-hover:translate-x-1 transition-transform"/></span>
                </button>
              )}
            </div>
          </div>
        );
      }

      // Complete Screen
      if (currentQ >= quizData.length - 1 && feedback?.type === 'success') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 flex items-center justify-center p-4">
            <Confetti show={true}/>
            <div className="bg-white/10 backdrop-blur-xl rounded-3xl p-8 max-w-lg w-full text-center border border-white/20">
              <div className="text-7xl mb-6">🎊</div>
              <h2 className="font-bangers text-4xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-400 mb-4">おめでとう！</h2>
              <p className="text-purple-200 text-lg mb-6">全てのクエストをクリアしました！</p>
              <div className="grid grid-cols-2 gap-4 mb-6">
                <div className="bg-white/10 rounded-2xl p-4"><p className="text-3xl font-bold text-yellow-400">{stats.points}</p><p className="text-purple-300 text-sm">ポイント</p></div>
                <div className="bg-white/10 rounded-2xl p-4"><p className="text-3xl font-bold text-cyan-400">{stats.correct}/{quizData.length}</p><p className="text-purple-300 text-sm">正解数</p></div>
              </div>
              <div className="mb-6">
                <p className="text-purple-300 mb-2 text-sm">獲得バッジ</p>
                <div className="flex justify-center gap-2 flex-wrap">
                  {badges.filter(b => earnedBadges.includes(b.id)).map(b => (
                    <div key={b.id} className="bg-white/10 rounded-xl px-3 py-1"><span className="text-xl">{b.icon}</span><p className="text-xs text-purple-300">{b.name}</p></div>
                  ))}
                </div>
              </div>
              <button onClick={reset} className="flex items-center justify-center gap-2 mx-auto px-6 py-3 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-full text-white font-bold hover:scale-105 transition-transform">
                <Icon name="refresh" className="w-5 h-5"/>もう一度挑戦
              </button>
            </div>
          </div>
        );
      }

      // Main Game
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 p-4 md:p-6">
          <Confetti show={showConfetti}/>
          
          {newBadge && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 animate-slide-down">
              <div className="bg-gradient-to-r from-yellow-500 to-orange-500 rounded-2xl px-5 py-3 shadow-2xl flex items-center gap-3">
                <span className="text-3xl">{newBadge.icon}</span>
                <div><p className="text-white font-bold text-sm">新しいバッジ獲得！</p><p className="text-yellow-100 text-xs">{newBadge.name}</p></div>
              </div>
            </div>
          )}

          <div className="max-w-3xl mx-auto">
            {/* Stats */}
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div className="flex items-center gap-3">
                <div className="bg-white/10 backdrop-blur-sm rounded-xl px-4 py-2 flex items-center gap-2 border border-white/20">
                  <Icon name="star" className="w-5 h-5 text-yellow-400"/><span className="text-white font-bold">{stats.points}</span>
                </div>
                {stats.streak >= 2 && (
                  <div className="bg-gradient-to-r from-orange-500 to-red-500 rounded-xl px-4 py-2 flex items-center gap-2 animate-pulse">
                    <Icon name="zap" className="w-5 h-5 text-white"/><span className="text-white font-bold">{stats.streak}連続！</span>
                  </div>
                )}
              </div>
              <div className="flex items-center gap-1">
                {badges.filter(b => earnedBadges.includes(b.id)).map(b => <span key={b.id} className="text-xl" title={b.name}>{b.icon}</span>)}
              </div>
            </div>

            {/* Progress */}
            <div className="mb-5">
              <div className="flex justify-between text-xs text-purple-300 mb-1">
                <span>クエスト {currentQ + 1} / {quizData.length}</span>
                <span>{Math.round((currentQ / quizData.length) * 100)}%</span>
              </div>
              <div className="h-2 bg-white/10 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 transition-all duration-500" style={{ width: `${(currentQ / quizData.length) * 100}%` }}/>
              </div>
            </div>

            {/* Question Card */}
            <div className="bg-white/10 backdrop-blur-xl rounded-2xl p-5 md:p-6 border border-white/20 shadow-2xl">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-xl font-bold text-white">{question.title}</h2>
                <div className="bg-gradient-to-r from-cyan-500 to-purple-500 rounded-full px-3 py-1"><span className="text-white font-bold text-sm">+{question.points}</span></div>
              </div>
              <p className="text-purple-100 mb-5">{question.question}</p>

              {/* Quiz */}
              {question.type === 'quiz' && (
                <div className="grid gap-2">
                  {question.options.map((opt, i) => (
                    <button key={i} onClick={() => !feedback && handleQuiz(i)} disabled={!!feedback}
                      className={`w-full text-left p-3 rounded-xl border-2 transition-all ${feedback ? (i === question.correct ? 'bg-green-500/30 border-green-400 text-green-100' : 'bg-white/5 border-white/10 text-purple-300') : 'bg-white/5 border-white/20 text-white hover:bg-white/10 hover:border-purple-400'}`}>
                      <span className="font-mono">{opt}</span>
                    </button>
                  ))}
                </div>
              )}

              {/* Fill */}
              {question.type === 'fill' && (
                <div className="space-y-3">
                  <div className="bg-gray-900/50 rounded-xl p-3 font-mono">
                    <span className="text-purple-300">{question.template.split('___')[0]}</span>
                    <input type="text" value={fillAnswer} onChange={(e) => setFillAnswer(e.target.value)} disabled={!!feedback}
                      className="bg-purple-500/30 border-2 border-purple-400 rounded-lg px-2 py-1 text-white focus:outline-none focus:border-cyan-400 mx-1 w-24" placeholder="..."/>
                    <span className="text-purple-300">{question.template.split('___')[1]}</span>
                  </div>
                  {!feedback && (
                    <button onClick={handleFill} className="flex items-center gap-2 px-5 py-2 bg-gradient-to-r from-green-500 to-emerald-500 rounded-xl text-white font-bold hover:scale-105 transition-transform">
                      <Icon name="check" className="w-5 h-5"/>回答する
                    </button>
                  )}
                </div>
              )}

              {/* Code */}
              {question.type === 'code' && (
                <div className="space-y-3">
                  <div className="relative">
                    <div className="absolute top-2 left-3 flex items-center gap-1 text-purple-400 text-xs"><Icon name="code" className="w-3 h-3"/>Python</div>
                    <textarea value={codeInput} onChange={(e) => setCodeInput(e.target.value)} disabled={!!feedback}
                      className="w-full h-32 bg-gray-900/80 rounded-xl p-3 pt-8 font-mono text-green-400 border-2 border-white/20 focus:outline-none focus:border-purple-400 resize-none text-sm" spellCheck={false}/>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={async () => setCodeOutput(await runPython(codeInput))} disabled={isRunning || pyLoading}
                      className="flex items-center gap-2 px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-xl text-white text-sm transition-colors disabled:opacity-50">
                      <Icon name="play" className="w-4 h-4"/>{isRunning ? '実行中...' : '実行'}
                    </button>
                    {!feedback && (
                      <button onClick={handleCode} disabled={isRunning || pyLoading}
                        className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-green-500 to-emerald-500 rounded-xl text-white font-bold text-sm hover:scale-105 transition-transform disabled:opacity-50">
                        <Icon name="check" className="w-4 h-4"/>提出
                      </button>
                    )}
                  </div>
                  {codeOutput && (
                    <div className="bg-gray-900/80 rounded-xl p-3 border-2 border-white/20">
                      <div className="flex items-center gap-1 text-purple-400 mb-1 text-xs"><Icon name="terminal" className="w-3 h-3"/>出力</div>
                      <pre className="font-mono text-cyan-300 whitespace-pre-wrap text-sm">{codeOutput}</pre>
                    </div>
                  )}
                </div>
              )}

              {/* Hint */}
              {!feedback && (
                <button onClick={() => setShowHint(!showHint)} className="mt-3 text-purple-300 hover:text-purple-200 text-sm flex items-center gap-1">
                  <Icon name="sparkle" className="w-4 h-4"/>{showHint ? 'ヒントを隠す' : 'ヒントを見る'}
                </button>
              )}
              {showHint && !feedback && (
                <div className="mt-2 bg-yellow-500/20 border border-yellow-500/30 rounded-xl p-3 text-yellow-200 text-sm">💡 {question.hint}</div>
              )}

              {/* Feedback */}
              {feedback && (
                <div className={`mt-4 p-3 rounded-xl flex items-center gap-2 ${feedback.type === 'success' ? 'bg-green-500/20 border border-green-500/30' : 'bg-red-500/20 border border-red-500/30'}`}>
                  <Icon name={feedback.type === 'success' ? 'check' : 'x'} className={`w-5 h-5 ${feedback.type === 'success' ? 'text-green-400' : 'text-red-400'}`}/>
                  <span className={feedback.type === 'success' ? 'text-green-200' : 'text-red-200'}>{feedback.msg}</span>
                </div>
              )}

              {/* Next */}
              {feedback && currentQ < quizData.length - 1 && (
                <button onClick={nextQ} className="mt-4 flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 rounded-xl text-white font-bold hover:scale-105 transition-transform mx-auto">
                  次のクエストへ<Icon name="arrow" className="w-5 h-5"/>
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
