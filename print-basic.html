<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>print()をマスターしよう - Python入門</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; margin: 0; }
    .font-title { font-family: 'Dela Gothic One', cursive; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    @keyframes slide-down { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); } 50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.8); } }
    .animate-float { animation: float 4s ease-in-out infinite; }
    .animate-bounce-slow { animation: bounce-slow 2s ease-in-out infinite; }
    .animate-fall { animation: fall 3s linear forwards; }
    .animate-slide-down { animation: slide-down 0.5s ease-out; }
    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 11. print() とは に対応した問題（5問）
    const quizData = [
      {
        id: 1, 
        type: 'quiz', 
        title: 'print() って何？ 🤔',
        question: 'print() は何をするための機能でしょう？',
        options: [
          '数字を計算する', 
          '画面に文字や数字を表示する', 
          'プログラムを終了する', 
          'ファイルを保存する'
        ],
        correct: 1, 
        points: 100, 
        hint: '「print」は英語で「印刷する」という意味です。画面に何かを映し出すイメージです！'
      },
      {
        id: 2, 
        type: 'quiz', 
        title: '正しい書き方は？ ✍️',
        question: '「こんにちは」と表示したい時、正しい書き方はどれ？',
        options: [
          'print(こんにちは)', 
          'print("こんにちは")', 
          'Print("こんにちは")', 
          'PRINT("こんにちは")'
        ],
        correct: 1, 
        points: 100, 
        hint: '文字列は "" で囲みます。また、print は小文字で書きます！'
      },
      {
        id: 3, 
        type: 'fill', 
        title: '穴埋めに挑戦！ 📝',
        question: '「こんにちは」と表示するコードを完成させてください',
        template: '___("こんにちは")', 
        answer: 'print', 
        alternativeAnswers: [],
        points: 100, 
        hint: '画面に表示するための関数の名前は...？'
      },
      {
        id: 4, 
        type: 'code', 
        title: 'コードを書こう① 💻',
        question: '「Hello」と画面に表示してください',
        starterCode: '# ここにコードを書いてね\nprint("Hello")',
        expectedOutput: 'Hello', 
        points: 150, 
        hint: 'print("表示したい文字") の形で書きます。文字は "" で囲みましょう！'
      },
      {
        id: 5, 
        type: 'code', 
        title: 'コードを書こう② 🐍',
        question: '「Python」と画面に表示してください',
        starterCode: '# ここにコードを書いてね\nprint("Python")',
        expectedOutput: 'Python', 
        points: 150, 
        hint: 'シングルクォート(\'\')でもダブルクォート("")でもOKです！'
      }
    ];

    // バッジ定義
    const badges = [
      { id: 'first_print', name: 'はじめての一歩', icon: '🌱', condition: (s) => s.correct >= 1 },
      { id: 'half_clear', name: '半分クリア', icon: '⭐', condition: (s) => s.completed >= 3 },
      { id: 'all_clear', name: 'print()マスター', icon: '👑', condition: (s) => s.completed >= quizData.length },
    ];

    // アイコンコンポーネント
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        play: <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>,
        star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor"/>,
        check: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" strokeWidth="2" fill="none"/><polyline points="22 4 12 14.01 9 11.01" stroke="currentColor" strokeWidth="2" fill="none"/></>,
        x: <><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="2" fill="none"/><line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" strokeWidth="2"/><line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" strokeWidth="2"/></>,
        code: <><polyline points="16 18 22 12 16 6" stroke="currentColor" strokeWidth="2" fill="none"/><polyline points="8 6 2 12 8 18" stroke="currentColor" strokeWidth="2" fill="none"/></>,
        terminal: <><polyline points="4 17 10 11 4 5" stroke="currentColor" strokeWidth="2" fill="none"/><line x1="12" y1="19" x2="20" y2="19" stroke="currentColor" strokeWidth="2"/></>,
        arrow: <><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" strokeWidth="2"/><polyline points="12 5 19 12 12 19" stroke="currentColor" strokeWidth="2" fill="none"/></>,
        refresh: <><polyline points="23 4 23 10 17 10" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" stroke="currentColor" strokeWidth="2" fill="none"/></>,
        sparkle: <><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4" stroke="currentColor" strokeWidth="1.5" fill="none"/></>
      };
      return <svg className={className} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">{icons[name]}</svg>;
    };

    // 紙吹雪コンポーネント
    const Confetti = ({ show }) => {
      if (!show) return null;
      const colors = ['#22C55E', '#10B981', '#34D399', '#6EE7B7', '#FBBF24', '#F472B6'];
      return (
        <div className="fixed inset-0 pointer-events-none z-50">
          {[...Array(40)].map((_, i) => (
            <div key={i} className="absolute animate-fall"
              style={{ left: `${Math.random() * 100}%`, top: '-20px', animationDelay: `${Math.random() * 0.5}s`, animationDuration: `${1.5 + Math.random() * 1.5}s` }}>
              <div className="w-3 h-3 rounded-sm" style={{ backgroundColor: colors[Math.floor(Math.random() * 6)], transform: `rotate(${Math.random() * 360}deg)` }}/>
            </div>
          ))}
        </div>
      );
    };

    // メインアプリ
    function App() {
      const [pyodide, setPyodide] = useState(null);
      const [pyLoading, setPyLoading] = useState(true);
      const [currentQ, setCurrentQ] = useState(0);
      const [stats, setStats] = useState({ points: 0, correct: 0, streak: 0, completed: 0 });
      const [earnedBadges, setEarnedBadges] = useState([]);
      const [showConfetti, setShowConfetti] = useState(false);
      const [feedback, setFeedback] = useState(null);
      const [fillAnswer, setFillAnswer] = useState('');
      const [codeInput, setCodeInput] = useState('');
      const [codeOutput, setCodeOutput] = useState('');
      const [isRunning, setIsRunning] = useState(false);
      const [showHint, setShowHint] = useState(false);
      const [gameStarted, setGameStarted] = useState(false);
      const [newBadge, setNewBadge] = useState(null);

      const question = quizData[currentQ];

      // Pyodide読み込み
      useEffect(() => {
        (async () => {
          try {
            const py = await loadPyodide();
            setPyodide(py);
            setPyLoading(false);
          } catch (e) { console.error(e); setPyLoading(false); }
        })();
      }, []);

      useEffect(() => {
        if (question?.type === 'code') setCodeInput(question.starterCode);
      }, [currentQ]);

      // バッジチェック
      useEffect(() => {
        badges.forEach(b => {
          if (b.condition(stats) && !earnedBadges.includes(b.id)) {
            setEarnedBadges(prev => [...prev, b.id]);
            setNewBadge(b);
            setTimeout(() => setNewBadge(null), 3000);
          }
        });
      }, [stats]);

      const runPython = async (code) => {
        if (!pyodide) return 'Python環境を読み込み中...';
        setIsRunning(true);
        try {
          pyodide.runPython(`import sys\nfrom io import StringIO\nsys.stdout = StringIO()`);
          pyodide.runPython(code);
          const output = pyodide.runPython('sys.stdout.getvalue()');
          setIsRunning(false);
          return output.trim();
        } catch (e) { setIsRunning(false); return `エラー: ${e.message}`; }
      };

      const celebrate = (points) => {
        setShowConfetti(true);
        setTimeout(() => setShowConfetti(false), 2000);
        setStats(p => ({ ...p, points: p.points + points, correct: p.correct + 1, streak: p.streak + 1, completed: p.completed + 1 }));
      };

      const handleQuiz = (idx) => {
        if (idx === question.correct) {
          celebrate(question.points);
          setFeedback({ type: 'success', msg: `正解！ +${question.points}ポイント 🎉` });
        } else {
          setStats(p => ({ ...p, streak: 0 }));
          setFeedback({ type: 'error', msg: 'おしい！正解を確認してみよう 💪' });
        }
      };

      const handleFill = () => {
        const correct = fillAnswer.trim().toLowerCase() === question.answer.toLowerCase() || 
                       question.alternativeAnswers?.map(a => a.toLowerCase()).includes(fillAnswer.trim().toLowerCase());
        if (correct) {
          celebrate(question.points);
          setFeedback({ type: 'success', msg: `完璧！ +${question.points}ポイント ✨` });
        } else {
          setStats(p => ({ ...p, streak: 0 }));
          setFeedback({ type: 'error', msg: `正解は「${question.answer}」でした！` });
        }
      };

      const handleCode = async () => {
        const output = await runPython(codeInput);
        setCodeOutput(output);
        if (output.trim() === question.expectedOutput.trim()) {
          celebrate(question.points);
          setFeedback({ type: 'success', msg: `すごい！正しく表示できました！ +${question.points}ポイント 🚀` });
        } else {
          setStats(p => ({ ...p, streak: 0 }));
          setFeedback({ type: 'error', msg: '出力が違うようです。もう一度確認してみよう！' });
        }
      };

      const nextQ = () => {
        if (currentQ < quizData.length - 1) {
          setCurrentQ(p => p + 1);
          setFeedback(null); setFillAnswer(''); setCodeOutput(''); setShowHint(false);
        }
      };

      const reset = () => {
        setCurrentQ(0);
        setStats({ points: 0, correct: 0, streak: 0, completed: 0 });
        setEarnedBadges([]); setFeedback(null); setFillAnswer(''); setCodeOutput(''); setShowHint(false); setGameStarted(false);
      };

      // スタート画面
      if (!gameStarted) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-green-900 to-slate-900 flex items-center justify-center p-4 overflow-hidden relative">
            <div className="absolute inset-0 overflow-hidden">
              {[...Array(10)].map((_, i) => (
                <div key={i} className="absolute rounded-full opacity-10 animate-float"
                  style={{ width: `${30 + Math.random() * 50}px`, height: `${30 + Math.random() * 50}px`, left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`, background: 'linear-gradient(45deg, #22C55E, #10B981)', animationDelay: `${Math.random() * 3}s`, animationDuration: `${4 + Math.random() * 3}s` }}/>
              ))}
            </div>
            <div className="relative z-10 text-center max-w-xl px-4">
              <div className="mb-6 animate-bounce-slow"><span className="text-6xl md:text-7xl">🖨️</span></div>
              <h1 className="font-title text-3xl md:text-4xl text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-400 mb-2">print() をマスターしよう</h1>
              <p className="text-base md:text-lg text-green-200 mb-6">画面に文字を表示する方法を学ぼう！</p>
              
              <div className="bg-slate-800/70 backdrop-blur-sm rounded-2xl p-4 mb-6 border border-green-500/30 max-w-sm mx-auto">
                <p className="text-green-400 font-mono text-left text-sm">
                  <span className="text-gray-500">{'>>>'}</span> print(<span className="text-yellow-300">"Hello"</span>)<br/>
                  <span className="text-green-300">Hello</span>
                </p>
              </div>

              <div className="flex flex-wrap justify-center gap-2 mb-6">
                <div className="bg-white/10 rounded-lg px-3 py-2 border border-white/20">
                  <p className="text-white text-sm">📝 全5問</p>
                </div>
                <div className="bg-white/10 rounded-lg px-3 py-2 border border-white/20">
                  <p className="text-white text-sm">🏆 バッジ3種</p>
                </div>
                <div className="bg-white/10 rounded-lg px-3 py-2 border border-white/20">
                  <p className="text-white text-sm">🐍 コード実行</p>
                </div>
              </div>

              {pyLoading ? (
                <div className="text-green-300 mb-4 text-sm"><span className="inline-block animate-spin mr-2">⚙️</span>Python環境を準備中...</div>
              ) : (
                <button onClick={() => setGameStarted(true)} className="group relative px-8 py-3 bg-gradient-to-r from-green-500 to-emerald-500 rounded-full text-white text-lg font-bold shadow-xl hover:scale-105 transition-all animate-pulse-glow">
                  <span className="flex items-center gap-2">はじめる<Icon name="arrow" className="w-5 h-5 group-hover:translate-x-1 transition-transform"/></span>
                </button>
              )}
            </div>
          </div>
        );
      }

      // 完了画面
      if (currentQ >= quizData.length - 1 && feedback?.type === 'success') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-green-900 to-slate-900 flex items-center justify-center p-4">
            <Confetti show={true}/>
            <div className="bg-slate-800/70 backdrop-blur-xl rounded-2xl p-6 max-w-md w-full text-center border border-green-500/30">
              <div className="text-6xl mb-4">🎉</div>
              <h2 className="font-title text-2xl text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-400 mb-3">おめでとう！</h2>
              <p className="text-green-200 mb-4">print() の基本をマスターしました！</p>
              
              <div className="bg-slate-900/60 rounded-xl p-3 mb-4 border border-green-500/30">
                <p className="text-green-400 font-mono text-sm">
                  <span className="text-gray-500">{'>>>'}</span> print(<span className="text-yellow-300">"やったね！"</span>)<br/>
                  <span className="text-green-300">やったね！</span>
                </p>
              </div>

              <div className="grid grid-cols-2 gap-3 mb-4">
                <div className="bg-white/10 rounded-xl p-3"><p className="text-2xl font-bold text-yellow-400">{stats.points}</p><p className="text-green-300 text-xs">ポイント</p></div>
                <div className="bg-white/10 rounded-xl p-3"><p className="text-2xl font-bold text-green-400">{stats.correct}/{quizData.length}</p><p className="text-green-300 text-xs">正解数</p></div>
              </div>
              <div className="mb-4">
                <p className="text-green-300 mb-2 text-xs">獲得バッジ</p>
                <div className="flex justify-center gap-2 flex-wrap">
                  {badges.filter(b => earnedBadges.includes(b.id)).map(b => (
                    <div key={b.id} className="bg-white/10 rounded-lg px-2 py-1"><span className="text-lg">{b.icon}</span><p className="text-xs text-green-300">{b.name}</p></div>
                  ))}
                </div>
              </div>
              <button onClick={reset} className="flex items-center justify-center gap-2 mx-auto px-5 py-2 bg-gradient-to-r from-green-500 to-emerald-500 rounded-full text-white font-bold hover:scale-105 transition-transform text-sm">
                <Icon name="refresh" className="w-4 h-4"/>もう一度
              </button>
            </div>
          </div>
        );
      }

      // メインゲーム画面
      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-green-900 to-slate-900 p-4">
          <Confetti show={showConfetti}/>
          
          {newBadge && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 animate-slide-down">
              <div className="bg-gradient-to-r from-green-500 to-emerald-500 rounded-xl px-4 py-2 shadow-xl flex items-center gap-2">
                <span className="text-2xl">{newBadge.icon}</span>
                <div><p className="text-white font-bold text-xs">バッジ獲得！</p><p className="text-green-100 text-xs">{newBadge.name}</p></div>
              </div>
            </div>
          )}

          <div className="max-w-2xl mx-auto">
            {/* ヘッダー */}
            <div className="flex items-center justify-between mb-4">
              <div className="bg-slate-800/70 rounded-lg px-3 py-2 flex items-center gap-2 border border-green-500/30">
                <Icon name="star" className="w-4 h-4 text-yellow-400"/><span className="text-white font-bold text-sm">{stats.points}</span>
              </div>
              <div className="flex items-center gap-1">
                {badges.filter(b => earnedBadges.includes(b.id)).map(b => <span key={b.id} className="text-lg" title={b.name}>{b.icon}</span>)}
              </div>
            </div>

            {/* プログレスバー */}
            <div className="mb-4">
              <div className="flex justify-between text-xs text-green-300 mb-1">
                <span>問題 {currentQ + 1} / {quizData.length}</span>
              </div>
              <div className="h-2 bg-slate-700 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-green-400 to-emerald-400 transition-all duration-500" style={{ width: `${((currentQ + 1) / quizData.length) * 100}%` }}/>
              </div>
            </div>

            {/* 問題カード */}
            <div className="bg-slate-800/70 backdrop-blur-xl rounded-2xl p-5 border border-green-500/30 shadow-xl">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-lg font-bold text-white">{question.title}</h2>
                <div className="bg-green-500/20 border border-green-500/50 rounded-full px-2 py-1"><span className="text-green-300 font-bold text-xs">+{question.points}</span></div>
              </div>
              <p className="text-green-100 mb-4">{question.question}</p>

              {/* クイズ形式 */}
              {question.type === 'quiz' && (
                <div className="grid gap-2">
                  {question.options.map((opt, i) => (
                    <button key={i} onClick={() => !feedback && handleQuiz(i)} disabled={!!feedback}
                      className={`w-full text-left p-3 rounded-xl border-2 transition-all text-sm ${feedback ? (i === question.correct ? 'bg-green-500/30 border-green-400 text-green-100' : 'bg-slate-700/50 border-slate-600 text-slate-400') : 'bg-slate-700/50 border-slate-600 text-white hover:bg-slate-700 hover:border-green-400'}`}>
                      <span className="font-mono">{opt}</span>
                    </button>
                  ))}
                </div>
              )}

              {/* 穴埋め形式 */}
              {question.type === 'fill' && (
                <div className="space-y-3">
                  <div className="bg-slate-900/60 rounded-xl p-3 font-mono text-sm">
                    <span className="text-green-300">{question.template.split('___')[0]}</span>
                    <input type="text" value={fillAnswer} onChange={(e) => setFillAnswer(e.target.value)} disabled={!!feedback}
                      className="bg-green-500/20 border-2 border-green-400 rounded-lg px-2 py-1 text-white focus:outline-none focus:border-emerald-400 mx-1 w-20 text-sm" placeholder="..."/>
                    <span className="text-green-300">{question.template.split('___')[1]}</span>
                  </div>
                  {!feedback && (
                    <button onClick={handleFill} className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-green-500 to-emerald-500 rounded-lg text-white font-bold hover:scale-105 transition-transform text-sm">
                      <Icon name="check" className="w-4 h-4"/>回答する
                    </button>
                  )}
                </div>
              )}

              {/* コード形式 */}
              {question.type === 'code' && (
                <div className="space-y-3">
                  <div className="relative">
                    <div className="absolute top-2 left-3 flex items-center gap-1 text-green-400 text-xs"><Icon name="code" className="w-3 h-3"/>Python</div>
                    <textarea value={codeInput} onChange={(e) => setCodeInput(e.target.value)} disabled={!!feedback}
                      className="w-full h-24 bg-slate-900/80 rounded-xl p-3 pt-7 font-mono text-green-400 border-2 border-green-500/30 focus:outline-none focus:border-green-400 resize-none text-sm" spellCheck={false}/>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={async () => setCodeOutput(await runPython(codeInput))} disabled={isRunning || pyLoading}
                      className="flex items-center gap-1 px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white text-sm transition-colors disabled:opacity-50">
                      <Icon name="play" className="w-4 h-4"/>{isRunning ? '実行中...' : '実行'}
                    </button>
                    {!feedback && (
                      <button onClick={handleCode} disabled={isRunning || pyLoading}
                        className="flex items-center gap-1 px-3 py-2 bg-gradient-to-r from-green-500 to-emerald-500 rounded-lg text-white font-bold text-sm hover:scale-105 transition-transform disabled:opacity-50">
                        <Icon name="check" className="w-4 h-4"/>提出
                      </button>
                    )}
                  </div>
                  {codeOutput && (
                    <div className="bg-slate-900/80 rounded-xl p-3 border-2 border-green-500/30">
                      <div className="flex items-center gap-1 text-green-400 mb-1 text-xs"><Icon name="terminal" className="w-3 h-3"/>出力</div>
                      <pre className="font-mono text-green-300 whitespace-pre-wrap text-sm">{codeOutput}</pre>
                    </div>
                  )}
                </div>
              )}

              {/* ヒント */}
              {!feedback && (
                <button onClick={() => setShowHint(!showHint)} className="mt-3 text-green-300 hover:text-green-200 text-xs flex items-center gap-1">
                  <Icon name="sparkle" className="w-3 h-3"/>{showHint ? 'ヒントを隠す' : 'ヒントを見る'}
                </button>
              )}
              {showHint && !feedback && (
                <div className="mt-2 bg-yellow-500/10 border border-yellow-500/30 rounded-lg p-3 text-yellow-200 text-sm">💡 {question.hint}</div>
              )}

              {/* フィードバック */}
              {feedback && (
                <div className={`mt-4 p-3 rounded-xl flex items-center gap-2 ${feedback.type === 'success' ? 'bg-green-500/20 border border-green-500/30' : 'bg-red-500/20 border border-red-500/30'}`}>
                  <Icon name={feedback.type === 'success' ? 'check' : 'x'} className={`w-5 h-5 ${feedback.type === 'success' ? 'text-green-400' : 'text-red-400'}`}/>
                  <span className={`text-sm ${feedback.type === 'success' ? 'text-green-200' : 'text-red-200'}`}>{feedback.msg}</span>
                </div>
              )}

              {/* 次へボタン */}
              {feedback && currentQ < quizData.length - 1 && (
                <button onClick={nextQ} className="mt-4 flex items-center gap-2 px-5 py-2 bg-gradient-to-r from-green-500 to-emerald-500 rounded-lg text-white font-bold hover:scale-105 transition-transform mx-auto text-sm">
                  次の問題へ<Icon name="arrow" className="w-4 h-4"/>
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
